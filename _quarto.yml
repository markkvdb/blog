project:
  type: website
  output-dir: docs
  resources:
    - CNAME
    - images/
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!_archive/**"
  post-render:
    - "rm -rf docs/_archive"

website:
  title: "Mark van der Broek"
  site-url: "https://mvanderbroek.com"
  llms-txt: true
  description: "Tutorials on data science and operations research"
  favicon: images/favicon.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: notes.qmd
        text: Notes
    right:
      - icon: github
        href: "https://github.com/markkvdb"
        aria-label: "Mark van der Broek on GitHub"
      - icon: linkedin
        href: "https://www.linkedin.com/in/mark-van-der-broek"
        aria-label: "Mark van der Broek on LinkedIn"
      - icon: rss
        href: index.xml
        aria-label: "RSS Feed"
  page-footer:
    left: "Copyright 2026 Mark van der Broek"
    right: "Built with Quarto"
  search: true

format:
  html:
    theme: cyborg
    toc: false
    code-copy: true
    anchor-sections: true

execute:
  freeze: auto
